aid: practice-fusion
name: Practice Fusion
description: >-
  Practice Fusion is a cloud-based electronic health record (EHR) platform for
  independent ambulatory medical practices, serving roughly 6.4% of U.S.
  ambulatory practices with more than 43 million clinical records and around 5
  million patient visits per month. Its developer surface centers on an ONC
  Certified Health IT FHIR R4 (Patient Data Sharing / PDS) API implementing US
  Core 6.1.0, SMART App Launch 2.0.0, and Bulk Data Access 1.0.1 over
  SMART-on-FHIR OAuth2, alongside proprietary bi-directional Labs and Imaging
  APIs and a partner marketplace of 600+ integrated companies.
