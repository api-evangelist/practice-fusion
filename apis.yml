- name: Practice Fusion Patient Fusion PHR API
  description: >-
    Patient-facing personal health record API documented in the PDS API
    Developer Guide. Serves a patient their own clinical documents and record
    data from the Practice Fusion EHR, authorized with OAuth 2.0 plus OpenID
    Connect through the Patient Fusion identity provider at
    auth.patientfusion.com, which publishes a full OIDC/RFC 8414 discovery
    document anonymously. Distinct from the FHIR PDS API: it uses a proprietary
    JSON surface with its own status-code table (including 300 Multiple Choices
    for an ambiguous patient match) rather than FHIR OperationOutcome.
  humanURL: https://www.practicefusion.com/pds-api/developer-guide/
  baseURL: https://api2.practicefusion.com/phr/patient/v1
  properties:
  - type: Documentation
    url: https://www.practicefusion.com/pds-api/developer-guide/
  - type: Authentication
    url: authentication/practice-fusion-authentication.yml
  - type: OpenIDConnect
    url: https://auth.patientfusion.com/.well-known/openid-configuration
  - type: WellKnown
    url: well-known/practice-fusion-well-known.yml
  - type: RateLimits
    url: rate-limits/practice-fusion-rate-limits.yml
  - type: ErrorCatalog
    url: errors/practice-fusion-problem-types.yml
- name: Practice Fusion Labs API
  description: >-
    Proprietary bi-directional laboratory integration API connecting practices
    with 300+ independent, hospital, and health-system labs including Labcorp,
    Quest Diagnostics, RadNet, SimonMed, and Rayus for lab order transmission
    and results delivery.
  humanURL: https://www.practicefusion.com/practice-fusion-apis/
