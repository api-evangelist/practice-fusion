apis:
- name: Practice Fusion FHIR API (Patient Data Sharing)
  description: >-
    ONC Certified FHIR R4 (v4.0.1) API implementing US Core 6.1.0, SMART App
    Launch 2.0.0, and Bulk Data Access 1.0.1. Provides read and search access
    across 47 FHIR resource types (Patient, Observation, Condition, Encounter,
    MedicationRequest, DiagnosticReport, DocumentReference, and more) via
    SMART-on-FHIR OAuth2 (authorization code, client credentials, refresh
    token). Provider/System access and Patient (FMH) access endpoints are
    provisioned per practice organization.
  humanURL: https://www.practicefusion.com/fhir/
  baseURL: https://api.practicefusion.com/fhir/r4/v1/
  properties:
  - type: Documentation
    url: https://www.practicefusion.com/fhir/api-specifications/
  - type: APIReference
    url: https://www.practicefusion.com/fhir/api-specifications/
  - type: GettingStarted
    url: https://www.practicefusion.com/fhir/get-started/
  - type: Authentication
    url: authentication/practice-fusion-authentication.yml
  - type: OAuthScopes
    url: scopes/practice-fusion-scopes.yml
  - type: WellKnown
    url: well-known/practice-fusion-well-known.yml
  - type: SmartConfiguration
    url: well-known/practice-fusion-smart-configuration.json
  - type: CapabilityStatement
    url: conformance/practice-fusion-capability-statement.json
- name: Practice Fusion Labs API
  description: >-
    Proprietary bi-directional laboratory integration API connecting practices
    with 300+ independent, hospital, and health-system labs including Labcorp,
    Quest Diagnostics, RadNet, SimonMed, and Rayus for lab order transmission
    and results delivery.
  humanURL: https://www.practicefusion.com/practice-fusion-apis/
  baseURL: https://www.practicefusion.com/labs-documentation/
  properties:
  - type: Documentation
    url: https://www.practicefusion.com/labs-documentation/
- name: Practice Fusion Imaging API
  description: >-
    Proprietary bi-directional imaging integration API for order receipt and
    study transmission across imaging providers, supporting 100,000+ medical
    professionals.
  humanURL: https://www.practicefusion.com/practice-fusion-apis/
  baseURL: https://www.practicefusion.com/imaging-documentation/
  properties:
  - type: Documentation
    url: https://www.practicefusion.com/imaging-documentation/
