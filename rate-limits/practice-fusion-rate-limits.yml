notes: >-
  Practice Fusion states that rate limiting IS enforced on every API call and
  that exhaustion returns HTTP 429, but publishes NO numeric limit, no window,
  no burst allowance and no rate-limit response headers. The developer guide is
  explicit that the limits are deliberately undisclosed and adjustable: "All
  developers will be subject to the same rate limiting logic, which was
  determined and may be adjusted pursuant to an architectural risk analysis and
  security best practices." An agent therefore has no runtime signal to budget
  against beyond reacting to a 429 — there is no X-RateLimit-*/RateLimit-* or
  Retry-After header documented anywhere on the developer surface.
enforced: true
limit_count: 0
limits: []
exhaustion:
  status: 429
  body: FHIR OperationOutcome (issue.code throttled)
  retry_after_header: undocumented
response_headers: []
