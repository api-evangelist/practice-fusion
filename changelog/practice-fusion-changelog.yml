notes: >-
  Practice Fusion publishes product release notes, but only for humans. The
  /release-notes/ path on the marketing site 301s to a Salesforce Experience
  Cloud (Lightning/Aura) community at help.practicefusion.com/s/releasenotes; the
  HTTP 200 body is a 62 KB JavaScript application shell that contains no release
  entries — the dated entries are fetched client-side from an Aura endpoint after
  render. Nothing dated is machine-readable, so entries[] below is empty by
  measurement, not by omission. There is NO changelog on the FHIR / PDS API
  developer surface at all: neither the API specifications page nor the developer
  guide carries a version history, a "what's new", or a deprecation notice.
  The one machine-readable version trail Practice Fusion does publish is the EHI
  Export data dictionary, which is versioned v1 through v9 as separate documented
  index pages — recorded below as the closest thing to a dated API change record.
