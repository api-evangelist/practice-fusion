notes: >-
  Practice Fusion's SMART-on-FHIR discovery documents are served per practice
  organization under the FHIR service base URL, not at the root api host: the
  provider/system surface at
  https://api.practicefusion.com/fhir/r4/v1/{organizationId} and the patient
  (FollowMyHealth) surface at
  https://api.practicefusion.com/fhir/fmh/r4/v1/{organizationId}. Both were
  fetched live against the published organization 118b460b-8390-4754-8e4a-1dd5ee20f599
  and saved verbatim. The patient surface delegates its issuer, JWKS, authorize,
  token and introspect endpoints to muauthentication.followmyhealth.com —
  FollowMyHealth is the patient-engagement platform of Veradigm, Practice
  Fusion's parent, which is why the FMH SMART configuration names a different
  host than the FHIR base it is served from. Separately, the Patient Fusion
  consumer identity provider at auth.patientfusion.com serves a full RFC 8414 /
  OIDC discovery document anonymously. The RFC 9116, RFC 8414 and OIDC paths at
  the ROOT of both www and api hosts all 404 — api.practicefusion.com fronts a
  Kong gateway that answers unrouted paths with {"message":"no Route matched
  with those values"}, and www.practicefusion.com returns its 404 HTML page.
  The master directory of live FHIR Service Base URLs for every practice is
  published at
  https://www.practicefusion.com/assets/static_files/ServiceBaseURLs.json (a
  6.8 MB FHIR Bundle of Organization + Endpoint resources).
